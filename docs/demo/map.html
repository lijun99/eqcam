<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>demo - M6.8 made-up demo event, Los Angeles</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body,#map{height:100%;margin:0} .legend{background:#fff;padding:6px 8px;font:12px sans-serif}
.legend span{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px}</style>
</head><body><div id="map"></div><script>
const points = [{"lat": 34.04, "lon": -118.27, "color": "#d62728", "label": "i10_downtown", "popup": "<b>i10_downtown</b> I-10 at downtown interchange<br><i>clear damage, fire or ground failure</i> (high confidence, demo made-up findings): Facade collapse with a dust cloud next to the freeway.<br>structural damage: yes. Parapet and facade of a building collapsed onto the sidewalk. AFTER frame<br>smoke or dust: yes. Dust cloud rising from the collapse. AFTER frame<br>Intensity (MMI) VIII: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 7.93 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. Image changed between BEFORE and AFTER: 21.5 % of the area. Image changed between BEFORE and LATEST: 21.5 % of the area. Flags: scene_changed.</small><br><a href=\"cameras/i10_downtown/tile.jpg\" target=\"_blank\"><img src=\"cameras/i10_downtown/tile.jpg\" width=\"380\"></a>"}, {"lat": 34.125, "lon": -118.33, "color": "#d62728", "label": "hollywood_hills", "popup": "<b>hollywood_hills</b> Ridge camera above Hollywood<br><i>clear damage, fire or ground failure</i> (high confidence, demo made-up findings): Fresh landslide on the slope below the road.<br>landslide: yes. New scar and debris on the slope below the road. AFTER frame<br>Intensity (MMI) VIII: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 7.93 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. Image changed between BEFORE and AFTER: 21.4 % of the area. Image changed between BEFORE and LATEST: 21.4 % of the area. Flags: frozen_at_the_end, scene_changed.</small><br><a href=\"cameras/hollywood_hills/tile.jpg\" target=\"_blank\"><img src=\"cameras/hollywood_hills/tile.jpg\" width=\"380\"></a>"}, {"lat": 33.74, "lon": -118.27, "color": "#f08a24", "label": "port_la", "popup": "<b>port_la</b> Port of Los Angeles terminal<br><i>possible damage, fire or ground failure</i> (medium confidence, demo made-up findings): Possible liquefaction near the wharf; water sloshing.<br>ground failure: uncertain. Possible sand boils and settlement near the wharf edge. AFTER frame<br>water: uncertain. Water sloshing in the slip. AFTER frame<br>Intensity (MMI) VII: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 7.93 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.1 px. Image changed between BEFORE and AFTER: 21.4 % of the area. Image changed between BEFORE and LATEST: 21.4 % of the area. Flags: frozen_at_the_end, scene_changed.</small><br><a href=\"cameras/port_la/tile.jpg\" target=\"_blank\"><img src=\"cameras/port_la/tile.jpg\" width=\"380\"></a>"}, {"lat": 34.14, "lon": -118.15, "color": "#f08a24", "label": "pasadena_710", "popup": "<b>pasadena_710</b> SR-710 at Pasadena<br><i>possible damage, fire or ground failure</i> (medium confidence, demo made-up findings): Possible fire: new smoke plume with a glow.<br>fire: uncertain. Glow at the base of the plume. AFTER frame<br>smoke or dust: uncertain. Gray plume behind the buildings, not in BEFORE. AFTER frame<br>Intensity (MMI) VII: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 7.93 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.1 px. Image changed between BEFORE and AFTER: 21.4 % of the area. Image changed between BEFORE and LATEST: 21.4 % of the area. Flags: frozen_at_the_end, scene_changed.</small><br><a href=\"cameras/pasadena_710/tile.jpg\" target=\"_blank\"><img src=\"cameras/pasadena_710/tile.jpg\" width=\"380\"></a>"}, {"lat": 34.008, "lon": -118.498, "color": "#e3b505", "label": "santa_monica_pier", "popup": "<b>santa_monica_pier</b> Santa Monica pier stream<br><i>shaking effects only</i> (medium confidence, demo made-up findings): Strong swaying of lamp posts; people leaving the pier.<br>people response: uncertain. About 30 people moving off the pier. AFTER frame<br>Intensity (MMI) V-VI: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 5.13 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. Image changed between BEFORE and AFTER: 0.0 % of the area. Image changed between BEFORE and LATEST: 0.0 % of the area.</small><br><a href=\"cameras/santa_monica_pier/tile.jpg\" target=\"_blank\"><img src=\"cameras/santa_monica_pier/tile.jpg\" width=\"380\"></a>"}, {"lat": 34.18, "lon": -118.31, "color": "#e3b505", "label": "burbank_5", "popup": "<b>burbank_5</b> I-5 at Burbank<br><i>shaking effects only</i> (medium confidence, demo made-up findings): Poles and signs swayed; no damage seen.<br>Intensity (MMI) V-VI: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 7.93 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. Image changed between BEFORE and AFTER: 0.0 % of the area. Image changed between BEFORE and LATEST: 0.0 % of the area.</small><br><a href=\"cameras/burbank_5/tile.jpg\" target=\"_blank\"><img src=\"cameras/burbank_5/tile.jpg\" width=\"380\"></a>"}, {"lat": 33.82, "lon": -118.18, "color": "#8a8f98", "label": "long_beach_405", "popup": "<b>long_beach_405</b> I-405 at Long Beach<br><i>nothing notable</i> (medium confidence, demo made-up findings): Light shaking, nothing notable.<br>Intensity (MMI) III-IV: made up for the demo<br><small>Shaking from 4.0 s to 8.0 s in the video (above the threshold for 4.0 s), peak at 4.93 s; image shake about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. Image changed between BEFORE and AFTER: 0.0 % of the area. Image changed between BEFORE and LATEST: 0.0 % of the area. Flags: frozen_at_the_end.</small><br><a href=\"cameras/long_beach_405/tile.jpg\" target=\"_blank\"><img src=\"cameras/long_beach_405/tile.jpg\" width=\"380\"></a>"}, {"lat": 34.16, "lon": -118.24, "color": "#4a6fa5", "label": "glendale_2", "popup": "<b>glendale_2</b> SR-2 at Glendale (no video)<br><i>not reviewed</i><br><small>No video for this camera.</small>"}];
const epi = [34.05, -118.25];
const map = L.map('map');
// basemaps that serve a page opened as a local file (OpenStreetMap's own tile servers block it):
// The National Map (USGS, public domain, United States only) and CARTO (worldwide, OpenStreetMap data)
const usgs = 'https://basemap.nationalmap.gov/arcgis/rest/services/';
const nationalMap = 'Basemap: <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map">USGS The National Map</a>';
const bases = {
  'USGS Topo': L.tileLayer(usgs + 'USGSTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, attribution: nationalMap}),
  'USGS Imagery': L.tileLayer(usgs + 'USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, attribution: nationalMap}),
  'CARTO Light (worldwide)': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom: 19, subdomains: 'abcd',
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'}),
};
L.control.layers(bases, null, {position: 'topright'}).addTo(map);
const bounds = [];
for (const p of points) {
  L.circleMarker([p.lat, p.lon], {radius: 8, color: '#222', weight: 1, fillColor: p.color, fillOpacity: 0.9})
    .bindPopup(p.popup, {maxWidth: 420}).bindTooltip(p.label).addTo(map);
  bounds.push([p.lat, p.lon]);
}
if (epi) { L.marker(epi).bindPopup("demo - M6.8 made-up demo event, Los Angeles").addTo(map); bounds.push(epi); }
if (bounds.length > 1) map.fitBounds(bounds, {padding: [40, 40]}); else map.setView(bounds[0] || [34, -118], 10);
// The National Map where it has coverage (the conterminous US, Alaska, Hawaii, Puerto Rico), CARTO elsewhere
const c = map.getCenter();
const inUS = (c.lat > 24 && c.lat < 50 && c.lng > -125 && c.lng < -66) || (c.lat > 51 && c.lat < 72 && c.lng < -129)
  || (c.lat > 18 && c.lat < 23 && c.lng > -161 && c.lng < -154) || (c.lat > 17.5 && c.lat < 18.6 && c.lng > -68 && c.lng < -65);
bases[inUS ? 'USGS Topo' : 'CARTO Light (worldwide)'].addTo(map);
const legend = L.control({position: 'bottomright'});
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.innerHTML = "<div><span style=\"background:#8a8f98\"></span>nothing notable</div><div><span style=\"background:#e3b505\"></span>shaking effects only</div><div><span style=\"background:#f08a24\"></span>possible damage, fire or ground failure</div><div><span style=\"background:#d62728\"></span>clear damage, fire or ground failure</div><div><span style=\"background:#4a6fa5\"></span>not reviewed</div>"; return d; };
legend.addTo(map);
</script></body></html>
