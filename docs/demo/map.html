</head><body><div id="map"></div><script>
const points = [{"lat": 34.04, "lon": -118.27, "color": "#d62728", "label": "i10_downtown", "popup": "<div class=\"pop\"><b>i10_downtown</b> I-10 at downtown interchange<br><i>clear damage, fire or ground failure</i>, high confidence<br>Facade collapse with a dust cloud next to the freeway.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI VIII (70 % confidence)</li><li>Structural damage: yes</li><li>Smoke or dust: yes</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.1 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li><li>Sudden change of the scene at 8 s</li><li>Scene changed: 21 % of the image</li></ul><details><summary>Details</summary><b>Shaking</b>: lamp posts swaying<br><b>Intensity</b>: made up for the demo<br><b>Structural damage</b>: Parapet and facade of a building collapsed onto the sidewalk. AFTER frame<br><b>Smoke or dust</b>: Dust cloud rising from the collapse. AFTER frame<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The scene changes suddenly in the same view (look for what changed) at 8.0-8.9 s. The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.13 s in the video (4.33 s), peak at 6.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 0.5 s, damping about 12.3 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 21.5 % of the area. Image changed between BEFORE and LATEST: 21.5 % of the area. Flags: scene_changed.</details><a href=\"cameras/i10_downtown/tile.jpg\" target=\"_blank\"><img src=\"cameras/i10_downtown/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes", "structural_damage": "yes", "smoke_or_dust": "yes"}}, {"lat": 34.125, "lon": -118.33, "color": "#d62728", "label": "hollywood_hills", "popup": "<div class=\"pop\"><b>hollywood_hills</b> Ridge camera above Hollywood<br><i>clear damage, fire or ground failure</i>, high confidence<br>Fresh landslide on the slope below the road.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI VIII (70 % confidence)</li><li>Landslide or rockfall: yes</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.1 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li><li>Sudden change of the scene at 8 s</li><li>Scene changed: 21 % of the image</li><li>Frozen at the end (possible outage)</li></ul><details><summary>Details</summary><b>Shaking</b>: lamp posts swaying<br><b>Intensity</b>: made up for the demo<br><b>Landslide or rockfall</b>: New scar and debris on the slope below the road. AFTER frame<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The scene changes suddenly in the same view (look for what changed) at 8.0-8.9 s. The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.13 s in the video (4.33 s), peak at 6.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 0.5 s, damping about 12.4 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 21.4 % of the area. Image changed between BEFORE and LATEST: 21.4 % of the area. Flags: frozen_at_the_end, scene_changed.</details><a href=\"cameras/hollywood_hills/tile.jpg\" target=\"_blank\"><img src=\"cameras/hollywood_hills/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes", "landslide": "yes", "camera_problem": "yes"}}, {"lat": 33.74, "lon": -118.27, "color": "#f08a24", "label": "port_la", "popup": "<div class=\"pop\"><b>port_la</b> Port of Los Angeles terminal<br><i>possible damage, fire or ground failure</i>, medium confidence<br>Possible liquefaction near the wharf; water sloshing.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI VII (50 % confidence)</li><li>Ground failure: uncertain</li><li>Flooding or water: uncertain</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.1 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li><li>Sudden change of the scene at 8 s</li><li>Scene changed: 21 % of the image</li><li>Frozen at the end (possible outage)</li></ul><details><summary>Details</summary><b>Shaking</b>: lamp posts swaying<br><b>Intensity</b>: made up for the demo<br><b>Ground failure</b>: Possible sand boils and settlement near the wharf edge. AFTER frame<br><b>Flooding or water</b>: Water sloshing in the slip. AFTER frame<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The scene changes suddenly in the same view (look for what changed) at 8.0-8.9 s. The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.13 s in the video (4.33 s), peak at 6.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.1 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 0.5 s, damping about 12.4 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 21.4 % of the area. Image changed between BEFORE and LATEST: 21.4 % of the area. Flags: frozen_at_the_end, scene_changed.</details><a href=\"cameras/port_la/tile.jpg\" target=\"_blank\"><img src=\"cameras/port_la/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes", "ground_failure": "uncertain", "water": "uncertain", "camera_problem": "yes"}}, {"lat": 34.14, "lon": -118.15, "color": "#f08a24", "label": "pasadena_710", "popup": "<div class=\"pop\"><b>pasadena_710</b> SR-710 at Pasadena<br><i>possible damage, fire or ground failure</i>, medium confidence<br>Possible fire: new smoke plume with a glow.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI VII (50 % confidence)</li><li>Fire: uncertain</li><li>Smoke or dust: uncertain</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.1 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li><li>Sudden change of the scene at 8 s</li><li>Scene changed: 21 % of the image</li><li>Frozen at the end (possible outage)</li></ul><details><summary>Details</summary><b>Shaking</b>: lamp posts swaying<br><b>Intensity</b>: made up for the demo<br><b>Fire</b>: Glow at the base of the plume. AFTER frame<br><b>Smoke or dust</b>: Gray plume behind the buildings, not in BEFORE. AFTER frame<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The scene changes suddenly in the same view (look for what changed) at 8.0-8.9 s. The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.13 s in the video (4.33 s), peak at 5.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.1 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 0.5 s, damping about 12.4 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 21.4 % of the area. Image changed between BEFORE and LATEST: 21.4 % of the area. Flags: frozen_at_the_end, scene_changed.</details><a href=\"cameras/pasadena_710/tile.jpg\" target=\"_blank\"><img src=\"cameras/pasadena_710/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes", "fire": "uncertain", "smoke_or_dust": "uncertain", "camera_problem": "yes"}}, {"lat": 34.008, "lon": -118.498, "color": "#e3b505", "label": "santa_monica_pier", "popup": "<div class=\"pop\"><b>santa_monica_pier</b> Santa Monica pier stream<br><i>shaking effects only</i>, medium confidence<br>Strong swaying of lamp posts; people leaving the pier.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI V-VI (50 % confidence)</li><li>People responding: uncertain</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.2 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li></ul><details><summary>Details</summary><b>Shaking</b>: lamp posts swaying<br><b>Intensity</b>: made up for the demo<br><b>People responding</b>: About 30 people moving off the pier. AFTER frame<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.2 s in the video (4.4 s), peak at 5.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 1.7 s, damping about 3.7 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 0.0 % of the area. Image changed between BEFORE and LATEST: 0.0 % of the area.</details><a href=\"cameras/santa_monica_pier/tile.jpg\" target=\"_blank\"><img src=\"cameras/santa_monica_pier/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes", "people_response": "uncertain"}}, {"lat": 34.18, "lon": -118.31, "color": "#e3b505", "label": "burbank_5", "popup": "<div class=\"pop\"><b>burbank_5</b> I-5 at Burbank<br><i>shaking effects only</i>, medium confidence<br>Poles and signs swayed; no damage seen.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI V-VI (50 % confidence)</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.2 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li></ul><details><summary>Details</summary><b>Shaking</b>: lamp posts swaying<br><b>Intensity</b>: made up for the demo<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.2 s in the video (4.4 s), peak at 5.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 0.5 s, damping about 12.4 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 0.0 % of the area. Image changed between BEFORE and LATEST: 0.0 % of the area.</details><a href=\"cameras/burbank_5/tile.jpg\" target=\"_blank\"><img src=\"cameras/burbank_5/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes"}}, {"lat": 33.82, "lon": -118.18, "color": "#8a8f98", "label": "long_beach_405", "popup": "<div class=\"pop\"><b>long_beach_405</b> I-405 at Long Beach<br><i>nothing notable</i>, medium confidence<br>Light shaking, nothing notable.<div class=\"h\">Review</div><ul><li>Shaking: yes</li><li>Intensity: MMI III-IV (50 % confidence)</li></ul><div class=\"h\">Video motion</div><ul><li>Camera vibration 3.8-8.2 s (4 s), up to 8 px</li><li>No mount resonance: motion closer to the ground shaking</li><li>Frozen at the end (possible outage)</li></ul><details><summary>Details</summary><b>Shaking</b>: <br><b>Intensity</b>: made up for the demo<br><b>Reviewed by</b> demo made-up findings<br><b>Video motion</b>: The camera vibrates (the whole image jitters within one view) from 3.8 s to 8.2 s in the video (4.4 s), peak at 5.0 s; image motion about 8.0 px, peak image velocity 100.0 px/s, permanent shift 0.0 px. The image motion is not a mount resonance: dominant 2.5 Hz (58 % of the motion near it), ringing 1.7 s, damping about 3.7 %; it is closer to the ground shaking, though its size still depends on the mount and the zoom. Image changed between BEFORE and AFTER: 0.0 % of the area. Image changed between BEFORE and LATEST: 0.0 % of the area. Flags: frozen_at_the_end.</details><a href=\"cameras/long_beach_405/tile.jpg\" target=\"_blank\"><img src=\"cameras/long_beach_405/tile.jpg\" width=\"380\"></a></div>", "tags": {"shaking": "yes", "camera_problem": "yes"}}, {"lat": 34.16, "lon": -118.24, "color": "#4a6fa5", "label": "glendale_2", "popup": "<div class=\"pop\"><b>glendale_2</b> SR-2 at Glendale (no video)<br><i>not reviewed</i><div class=\"h\">Video motion</div><ul><li>No video</li></ul><details><summary>Details</summary><b>Video motion</b>: No video for this camera.</details></div>", "tags": {"camera_problem": "yes"}}];
const tags = [{"key": "shaking", "label": "Shaking", "yes": 7, "uncertain": 0}, {"key": "structural_damage", "label": "Structural damage", "yes": 1, "uncertain": 0}, {"key": "infrastructure_damage", "label": "Road, bridge or utility damage", "yes": 0, "uncertain": 0}, {"key": "landslide", "label": "Landslide or rockfall", "yes": 1, "uncertain": 0}, {"key": "ground_failure", "label": "Ground failure", "yes": 0, "uncertain": 1}, {"key": "fire", "label": "Fire", "yes": 0, "uncertain": 1}, {"key": "smoke_or_dust", "label": "Smoke or dust", "yes": 1, "uncertain": 1}, {"key": "power_outage", "label": "Power outage", "yes": 0, "uncertain": 0}, {"key": "water", "label": "Flooding or water", "yes": 0, "uncertain": 1}, {"key": "people_response", "label": "People responding", "yes": 0, "uncertain": 1}, {"key": "camera_problem", "label": "Camera dark, frozen or no video", "yes": 5, "uncertain": 0}];
const epi = [34.05, -118.25];
const map = L.map('map');
// basemaps that serve a page opened as a local file (OpenStreetMap's own tile servers block it):
// The National Map (USGS, public domain, United States only) and CARTO (worldwide, OpenStreetMap data)
const usgs = 'https://basemap.nationalmap.gov/arcgis/rest/services/';
const nationalMap = 'Basemap: <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map">USGS The National Map</a>';
const bases = {
  'USGS Topo': L.tileLayer(usgs + 'USGSTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, attribution: nationalMap}),
  'USGS Imagery': L.tileLayer(usgs + 'USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, attribution: nationalMap}),
  'CARTO Light (worldwide)': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxZoom: 19, subdomains: 'abcd',
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'}),
};
L.control.layers(bases, null, {position: 'topright'}).addTo(map);
const small = window.matchMedia('(max-width: 768px), (pointer: coarse)').matches;
function foldable(d, open) {
  d.querySelector('.ph').addEventListener('click', () => d.classList.toggle('closed'));
  if (!open) d.classList.add('closed');
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.disableScrollPropagation(d);
  return d;
}
// the popups: no taller than most of the screen (they scroll inside), the map panned to show them from their
// beginning, again when their images load or a pull-down opens; the panels hidden while one is open
const popupOptions = w => ({maxWidth: Math.min(w, window.innerWidth - 60),
  maxHeight: Math.round(window.innerHeight * 0.75), autoPanPadding: [12, 12]});
map.on('popupopen', e => {
  document.body.classList.add('popup-open');
  const el = e.popup.getElement();
  const top = () => { const c = el.querySelector('.leaflet-popup-content'); if (c) c.scrollTop = 0; };
  const again = () => { e.popup.update(); top(); };
  top();
  el.querySelectorAll('img').forEach(img => { if (!img.complete) img.addEventListener('load', again, {once: true}); });
  el.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => e.popup.update()));
});
map.on('popupclose', () => document.body.classList.remove('popup-open'));
const bounds = [];
for (const p of points) {
  p.marker = L.circleMarker([p.lat, p.lon], {radius: 8, color: '#222', weight: 1, fillColor: p.color, fillOpacity: 0.9})
    .bindPopup(p.popup, popupOptions(420)).bindTooltip(p.label).addTo(map);
  bounds.push([p.lat, p.lon]);
}
// the filter: the cameras with any of the checked tags are shown (a dashed outline if only uncertain);
// the others are dimmed, or hidden
const filter = L.control({position: 'topleft'});
filter.onAdd = () => {
  const d = L.DomUtil.create('div', 'filter');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  d.innerHTML = '<div class="ph">Show cameras with</div><div class="pb">' + tags.map(t =>
      `<label class="${t.yes + t.uncertain ? '' : 'zero'}"><input type="checkbox" data-tag="${t.key}"> ` +
      `${esc(t.label)}<span class="n">${t.yes}${t.uncertain ? ' + ' + t.uncertain + '?' : ''}</span></label>`).join('') +
    '<hr><label><input type="checkbox" id="f-uncertain" checked> include uncertain (?)</label>' +
    '<label><input type="checkbox" id="f-hide"> hide the other cameras</label></div>';
  d.addEventListener('change', update);
  return foldable(d, !small);
};
filter.addTo(map);
function update() {
  const checked = [...document.querySelectorAll('.filter input[data-tag]:checked')].map(i => i.dataset.tag);
  const uncertain = document.getElementById('f-uncertain').checked;
  const hide = document.getElementById('f-hide').checked;
  for (const p of points) {
    const states = checked.map(k => p.tags[k]).filter(s => s === 'yes' || (uncertain && s === 'uncertain'));
    const match = !checked.length || states.length > 0;
    const sure = !checked.length || states.includes('yes');
    if (match) {
      p.marker.setStyle({opacity: 1, fillOpacity: 0.9, weight: sure ? 1 : 2, dashArray: sure ? null : '3 2'});
      p.marker.setRadius(8);
    } else {
      p.marker.setStyle({opacity: 0.35, fillOpacity: 0.15, weight: 1, dashArray: null});
      p.marker.setRadius(5);
    }
    if (match || !hide) { if (!map.hasLayer(p.marker)) p.marker.addTo(map); } else p.marker.remove();
    if (match && checked.length && map.hasLayer(p.marker)) p.marker.bringToFront();
  }
}
if (epi) { L.marker(epi).bindPopup("demo - M6.8 made-up demo event, Los Angeles").addTo(map); bounds.push(epi); }
if (bounds.length > 1) map.fitBounds(bounds, {padding: [40, 40]}); else map.setView(bounds[0] || [34, -118], 10);
// The National Map where it has coverage (the conterminous US, Alaska, Hawaii, Puerto Rico), CARTO elsewhere
const c = map.getCenter();
const inUS = (c.lat > 24 && c.lat < 50 && c.lng > -125 && c.lng < -66) || (c.lat > 51 && c.lat < 72 && c.lng < -129)
  || (c.lat > 18 && c.lat < 23 && c.lng > -161 && c.lng < -154) || (c.lat > 17.5 && c.lat < 18.6 && c.lng > -68 && c.lng < -65);
bases[inUS ? 'USGS Topo' : 'CARTO Light (worldwide)'].addTo(map);
const legend = L.control({position: 'bottomright'});
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = '<div class="ph">Legend</div><div class="pb">' + "<div><span style=\"background:#8a8f98\"></span>nothing notable</div><div><span style=\"background:#e3b505\"></span>shaking effects only</div><div><span style=\"background:#f08a24\"></span>possible damage, fire or ground failure</div><div><span style=\"background:#d62728\"></span>clear damage, fire or ground failure</div><div><span style=\"background:#4a6fa5\"></span>not reviewed</div>" + '</div>';
  return foldable(d, !small); };
legend.addTo(map);
</script></body></html>
